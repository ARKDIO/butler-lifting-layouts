<svg width="800" height="1000" viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#111111" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- ============ 배경 ============ -->
  <rect width="800" height="1000" fill="#FBFAF8"/>

  <!-- ============ 블록 텍스처 (라벨 없는 암시용) ============ -->
  <rect x="170" y="350" width="120" height="90"  rx="6" fill="#F4F1EB"/>
  <rect x="570" y="330" width="80"  height="110" rx="6" fill="#F4F1EB"/>
  <rect x="160" y="578" width="150" height="76"  rx="6" fill="#F4F1EB"/>

  <!-- ============ 도로 ============ -->
  <!-- 이면도로 (도산대로50길 / 54길) -->
  <rect x="332" y="546" width="14" height="334" fill="#F1EEE8"/>
  <rect x="536" y="546" width="14" height="334" fill="#F1EEE8"/>
  <!-- 언주로 / 선릉로 -->
  <rect x="80"  y="0" width="56" height="880" fill="#EFECE6" stroke="#E6E2D9" stroke-width="1"/>
  <rect x="664" y="0" width="56" height="880" fill="#EFECE6" stroke="#E6E2D9" stroke-width="1"/>
  <!-- 도산대로 (주도로) -->
  <rect x="0" y="470" width="800" height="76" fill="#EAE6DF"/>
  <line x1="0" y1="470" x2="800" y2="470" stroke="#E0DCD3" stroke-width="1"/>
  <line x1="0" y1="546" x2="800" y2="546" stroke="#E0DCD3" stroke-width="1"/>
  <line x1="0" y1="508" x2="800" y2="508" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="14 10"/>

  <!-- ============ 도로명 (반복 없이 1회) ============ -->
  <text x="248" y="531" text-anchor="middle" font-size="14" font-weight="600" fill="#6F6B64">도산대로</text>
  <text transform="translate(108,690) rotate(-90)" text-anchor="middle" font-size="13" font-weight="500" fill="#8A8A8A">언주로</text>
  <text transform="translate(692,740) rotate(-90)" text-anchor="middle" font-size="13" font-weight="500" fill="#8A8A8A">선릉로</text>
  <text transform="translate(339,690) rotate(-90)" text-anchor="middle" font-size="9.5" fill="#A5A19A">도산대로50길</text>
  <text transform="translate(543,690) rotate(-90)" text-anchor="middle" font-size="9.5" fill="#A5A19A">도산대로54길</text>

  <!-- ============ 방면 표시 ============ -->
  <text x="16"  y="456" font-size="11" fill="#8A8A8A">&#8592; 신사역 방면</text>
  <text x="784" y="456" text-anchor="end" font-size="11" fill="#8A8A8A">청담 방면 &#8594;</text>

  <!-- 선릉로 북측 — 압구정로데오역 -->
  <line x1="692" y1="52" x2="692" y2="28" stroke="#8A8A8A" stroke-width="1.5"/>
  <polygon points="692,18 687,29 697,29" fill="#8A8A8A"/>
  <text x="676" y="40" text-anchor="end" font-size="11" fill="#6F6B64">압구정로데오역 &#183; 수인분당선</text>

  <!-- 언주로 남측 — 학동역 -->
  <line x1="108" y1="818" x2="108" y2="850" stroke="#8A8A8A" stroke-width="1.5"/>
  <polygon points="108,860 103,849 113,849" fill="#8A8A8A"/>
  <text x="146" y="842" font-size="11" fill="#6F6B64">학동역 &#183; 7호선</text>

  <!-- ============ 교차로 / 정류장 ============ -->
  <rect x="52" y="494" width="112" height="28" rx="14" fill="#FFFFFF" stroke="#D8D4CB" stroke-width="1"/>
  <text x="108" y="513" text-anchor="middle" font-size="12.5" font-weight="600" fill="#111111">학동사거리</text>

  <circle cx="720" cy="640" r="5" fill="#6F6B64" stroke="#FFFFFF" stroke-width="2"/>
  <text x="732" y="644" font-size="10.5" fill="#8A8A8A">영동고교앞</text>

  <!-- ============ 랜드마크 ============ -->
  <rect x="562" y="570" width="88" height="72" rx="6" fill="#F0EDE7" stroke="#E3DFD6" stroke-width="1"/>
  <text x="606" y="662" text-anchor="middle" font-size="11.5" fill="#8A8A8A">더채플앳청담</text>

  <!-- ============ 대동타워 (버틀러클리닉) ============ -->
  <rect x="370" y="570" width="90" height="94" rx="6" fill="#1D1B18"/>
  <text x="415" y="612" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">대동타워</text>
  <text x="415" y="634" text-anchor="middle" font-size="10.5" fill="#FFFFFF" fill-opacity="0.7">7F 버틀러클리닉</text>

  <!-- 핀 (도산대로변 진입) -->
  <polygon points="403,524 427,524 415,558" fill="#1D1B18"/>
  <circle cx="415" cy="514" r="16" fill="#1D1B18"/>
  <circle cx="415" cy="514" r="5.5" fill="#FBFAF8"/>

  <!-- 리더선 -->
  <line x1="415" y1="356" x2="415" y2="492" stroke="#9A9A9A" stroke-width="1" stroke-dasharray="3 5"/>

  <!-- ============ 메인 카드 ============ -->
  <rect x="280" y="180" width="270" height="118" rx="14" fill="#FFFFFF" stroke="#E4E0D8" stroke-width="1" filter="url(#sh)"/>
  <text x="415" y="214" text-anchor="middle" font-size="10.5" letter-spacing="3" fill="#9A9A9A">BUTLER CLINIC</text>
  <text x="415" y="248" text-anchor="middle" font-size="25" font-weight="700" fill="#111111">버틀러클리닉</text>
  <text x="415" y="276" text-anchor="middle" font-size="13" fill="#6F6B64">대동타워 7층 &#183; 도산대로 326</text>

  <!-- 특장점 칩 -->
  <rect x="297" y="316" width="36" height="26" rx="13" fill="#FFFFFF" stroke="#E4E0D8" stroke-width="1"/>
  <text x="315" y="333" text-anchor="middle" font-size="11" font-weight="600" fill="#57534C">7F</text>
  <rect x="341" y="316" width="92" height="26" rx="13" fill="#FFFFFF" stroke="#E4E0D8" stroke-width="1"/>
  <text x="387" y="333" text-anchor="middle" font-size="11" font-weight="600" fill="#57534C">발렛 서비스</text>
  <rect x="441" y="316" width="92" height="26" rx="13" fill="#FFFFFF" stroke="#E4E0D8" stroke-width="1"/>
  <text x="487" y="333" text-anchor="middle" font-size="11" font-weight="600" fill="#57534C">기계식 주차</text>

  <!-- ============ 나침반 ============ -->
  <circle cx="44" cy="46" r="17" fill="#FFFFFF" stroke="#D8D4CB" stroke-width="1"/>
  <polygon points="44,36 39,52 44,48 49,52" fill="#6F6B64"/>
  <text x="44" y="80" text-anchor="middle" font-size="10" fill="#8A8A8A">N</text>

  <!-- ============ 하단 정보 스트립 ============ -->
  <rect x="0" y="880" width="800" height="120" fill="#FFFFFF"/>
  <line x1="0" y1="880" x2="800" y2="880" stroke="#E4E0D8" stroke-width="1"/>
  <text x="400" y="928" text-anchor="middle" font-size="15" font-weight="500" fill="#111111">서울특별시 강남구 도산대로 326 대동타워 7층</text>
  <text x="400" y="958" text-anchor="middle" font-size="12.5" fill="#8A8A8A">대동타워 건물 주차(기계식) &#183; 발렛 서비스 운영 &#183; 일부 차종 주차 제한</text>
</svg>
