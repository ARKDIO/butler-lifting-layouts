    <circle cx="521" cy="559" r="6.5" fill="#B9BDCB"/>
    <text x="506" y="565" text-anchor="end" font-size="15" fill="#A6AABE">씨네시티빌딩</text>

    <circle cx="949" cy="121" r="6.5" fill="#B9BDCB"/>
    <text x="965" y="127" font-size="15" fill="#A6AABE">K현대미술관</text>

    <circle cx="1092" cy="243" r="6.5" fill="#B9BDCB"/>
    <text x="1076" y="249" text-anchor="end" font-size="15" fill="#A6AABE">일지아트홀</text>

    <circle cx="1031" cy="328" r="6.5" fill="#B9BDCB"/>
    <text x="1015" y="334" text-anchor="end" font-size="15" fill="#A6AABE">LG전자 플래그십</text>

    <circle cx="820" cy="186" r="6.5" fill="#B9BDCB"/>
    <text x="836" y="192" font-size="15" fill="#A6AABE">스탠다드브레드 도산</text>

    <circle cx="385" cy="352" r="6.5" fill="#B9BDCB"/>
    <text x="401" y="358" font-size="15" fill="#A6AABE">스투시 서울</text>

    <circle cx="1128" cy="1178" r="5" fill="#B9BDCB"/>
    <text x="1141" y="1184" font-size="14" fill="#A6AABE">영동고교앞</text>
  </g>

  <!-- ============ 학동사거리 (도산대로 × 선릉로) ============ -->
  <rect x="999" y="464" width="112" height="27" rx="13.5" fill="#FFFFFF" stroke="#D5D8E3" stroke-width="1"/>
  <text x="1055" y="483" text-anchor="middle" font-size="13.5" font-weight="600" fill="#3D414E">학동사거리</text>

  <!-- ============ 압구정로데오역 (수인분당선 · 선릉로 북측) ============ -->
  <line x1="1136" y1="52" x2="1110" y2="255" stroke="#F0A800" stroke-width="8" stroke-linecap="round"/>
  <circle cx="1127" cy="120" r="29" fill="#FFFFFF" stroke="#F0A800" stroke-width="7"/>
  <text x="1127" y="116" text-anchor="middle" font-size="13.5" font-weight="700" fill="#F0A800">수인</text>
  <text x="1127" y="133" text-anchor="middle" font-size="13.5" font-weight="700" fill="#F0A800">분당</text>
  <text x="1172" y="118" font-size="18" font-weight="600" fill="#3D414E">압구정로데오역</text>
</svg>
