<svg width="1400" height="1450" viewBox="0 0 1400 1450" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <!-- 실제 지도 트레이싱 · 정중앙(700,725) = 대동타워 (핀 없음) -->
  <rect width="1400" height="1450" fill="#E2E5F1"/>

  <!-- ============ 블록 음영 ============ -->
  <g fill="#E9EBF6" stroke="#E9EBF6" stroke-width="18" stroke-linejoin="round">
    <polygon points="110,495 555,415 585,640 140,745"/>
    <polygon points="630,240 818,205 852,530 650,595"/>
    <polygon points="652,700 850,602 886,828 668,876"/>
    <polygon points="905,585 1035,512 1048,765 915,808"/>
    <polygon points="700,905 890,852 940,1030 730,1085"/>
    <polygon points="300,995 600,918 650,1145 330,1235"/>
    <polygon points="1150,300 1268,278 1280,470 1162,495"/>
    <polygon points="1160,900 1360,860 1380,1350 1200,1380"/>
  </g>

  <!-- 도산공원 (좌상단 녹지) -->
